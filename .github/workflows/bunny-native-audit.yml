name: Bunny Native Source Audit v0.3

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/bunny_native_audit.py'
      - 'tests/test_bunny_native_audit.py'
      - 'Data/init.yaml'
      - 'Controllers/**'
      - '.github/workflows/bunny-native-audit.yml'
  push:
    branches: [main]
    paths:
      - 'tools/bunny_native_audit.py'
      - 'tests/test_bunny_native_audit.py'
      - '.github/workflows/bunny-native-audit.yml'

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Source and dataset safety regressions
        run: python3 -m unittest discover -s tests -p 'test_bunny_native_audit.py' -v
      - name: Synthetic local SQLite and static inventory
        run: |
          python3 tools/bunny_native_audit.py --strict --synthetic-sqlite 1500 --output "$RUNNER_TEMP/bunny-native-source-audit.json"
      - name: Attach non-secret static audit
        uses: actions/upload-artifact@v4
        with:
          name: bunny-native-v0.3-source-audit
          path: ${{ runner.temp }}/bunny-native-source-audit.json
          retention-days: 14
