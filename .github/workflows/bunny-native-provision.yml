name: Bunny native provisioning safety
on:
  pull_request:
    paths: ['bunny/**', 'tools/bunny_tracker_probe.py', 'tools/bunny_native_package.py', 'tests/test_*.py', 'install-bunny.sh', '.github/workflows/bunny-native-provision.yml']
  push:
    branches: [main]
    paths: ['bunny/**', 'tools/bunny_tracker_probe.py', 'tools/bunny_native_package.py', 'tests/test_*.py', 'install-bunny.sh', '.github/workflows/bunny-native-provision.yml']
permissions:
  contents: read
jobs:
  provisioning-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Control-plane regressions (offline; never live acceptance)
        run: |
          python3 -W error::ResourceWarning -m unittest discover -s tests -p 'test_*.py'
          python3 bunny/cli.py native-staging plan
          sh -n install-bunny.sh
