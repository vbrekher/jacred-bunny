name: Publish JacRed Bunny image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bunny/cli.py'
      - 'tests/test_bunny_installer.py'
      - 'Dockerfile.bunny'
      - 'bunny/boot.sh'
      - 'bunny/cron-job.sh'
      - 'bunny/crontabs/**'
      - 'JacRed.csproj'
      - '**/*.cs'
      - 'web/**'
      - 'Data/**'
      - 'scripts/build-web-ui.sh'
      - '.github/workflows/bunny-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Offline CLI source smoke
        run: |
          python3 bunny/cli.py self-test
          python3 -m unittest discover -s tests -p 'test_bunny_installer.py' -v
          python3 -m py_compile bunny/cli.py
          bash -n bunny/build-push.sh
          sh -n install-bunny.sh bunny/boot.sh bunny/cron-job.sh
      - name: Enable buildx
        uses: docker/setup-buildx-action@v3
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish this fork
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.bunny
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            JACRED_VERSION=${{ github.sha }}
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/jacred-bunny:main', github.repository_owner) || '' }}
            ghcr.io/${{ github.repository_owner }}/jacred-bunny:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Generate SBOM for the exact published digest
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/jacred-bunny@${{ steps.publish.outputs.digest }}
          syft-version: v1.56.0
          format: spdx-json
          artifact-name: jacred-bunny-${{ github.sha }}-sbom.spdx.json
          output-file: jacred-bunny-sbom.spdx.json
          upload-release-assets: false
          upload-artifact-retention: 14
      - name: Record immutable artifact identity
        run: |
          printf '%s\n' 'ghcr.io/${{ github.repository_owner }}/jacred-bunny@${{ steps.publish.outputs.digest }}' > image-digest.txt
          sha256sum jacred-bunny-sbom.spdx.json > sbom.sha256
      - name: Save digest and SBOM checksum
        uses: actions/upload-artifact@v4
        with:
          name: jacred-bunny-${{ github.sha }}-identity
          path: |
            image-digest.txt
            sbom.sha256
          retention-days: 14
